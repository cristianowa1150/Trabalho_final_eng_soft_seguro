spring.application.name=artificio

# Banco de dados H2 (em memória para execução autocontida do MVP)
spring.datasource.url=jdbc:h2:mem:artificiodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Console H2 (para inspeção durante o desenvolvimento)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Limites de upload de arquivos (BLOB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Demonstração e Testes (desativado automaticamente em perfil prod)
artificio.demo.exibir-credenciais=true

