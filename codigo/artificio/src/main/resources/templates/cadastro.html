<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::#conteudo})}">
<head>
    <title>Criar Conta - Artifício</title>
</head>
<body>
<div id="conteudo" style="max-width: 480px; margin: 20px auto;">
    <div class="card">
        <div style="margin-bottom: 15px; border-bottom: 1px solid #eeeeee; padding-bottom: 8px;">
            <h2 style="font-size: 16px; font-weight: bold;">Junte-se ao Artifício</h2>
            <p style="color: #666666; font-size: 12px;">Preencha os campos abaixo para criar sua conta de acesso.</p>
        </div>

        <form th:action="@{/cadastro}" th:object="${cadastroDto}" method="post">
            <div class="form-group">
                <label for="nome" class="form-label">Nome Completo</label>
                <input type="text" id="nome" th:field="*{nome}" class="form-control" placeholder="Seu nome ou pseudônimo" required />
                <div th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="form-error">Erro no nome</div>
            </div>

            <div class="form-group">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="seu@email.com" required />
                <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="form-error">Erro no e-mail</div>
            </div>

            <div class="form-group">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" id="senha" th:field="*{senha}" class="form-control" placeholder="Mínimo de 6 caracteres" required />
                <div th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}" class="form-error">Erro na senha</div>
            </div>

            <div class="form-group">
                <label class="form-label">Tipo de Perfil</label>
                <div style="display: flex; gap: 20px; margin-top: 4px;">
                    <label style="font-size: 13px; cursor: pointer;">
                        <input type="radio" th:field="*{role}" value="ROLE_CLIENTE" checked />
                        Cliente (contratante)
                    </label>
                    <label style="font-size: 13px; cursor: pointer;">
                        <input type="radio" th:field="*{role}" value="ROLE_ARTISTA" />
                        Artista (prestador)
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="bio" class="form-label">Biografia / Estilo (Opcional)</label>
                <textarea id="bio" th:field="*{bio}" class="form-control" rows="3" placeholder="Informações do seu perfil ou trabalho artístico..."></textarea>
            </div>

            <div class="form-group">
                <label for="chavePix" class="form-label">Chave PIX (Apenas para Artistas)</label>
                <input type="text" id="chavePix" th:field="*{chavePix}" class="form-control" placeholder="Chave para recebimento" />
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
                Concluir Cadastro
            </button>
        </form>

        <div style="text-align: center; margin-top: 15px; padding-top: 10px; border-top: 1px solid #eeeeee; font-size: 12px; color: #666666;">
            Já possui uma conta? <a th:href="@{/login}" style="color: #0066cc;">Faça login aqui</a>
        </div>
    </div>
</div>
</body>
</html>
