<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::#conteudo})}">
<head>
    <title>Entrar na Plataforma - Artifício</title>
</head>
<body>
<div id="conteudo" style="max-width: 400px; margin: 30px auto;">
    <div class="card">
        <div style="margin-bottom: 15px; border-bottom: 1px solid #eeeeee; padding-bottom: 8px;">
            <h2 style="font-size: 16px; font-weight: bold;">Acesse sua Conta</h2>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="seu@email.com" required autofocus />
            </div>

            <div class="form-group">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" id="senha" name="senha" class="form-control" placeholder="••••••••" required />
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
                Entrar
            </button>
        </form>

        <div style="text-align: center; margin-top: 15px; padding-top: 10px; border-top: 1px solid #eeeeee; font-size: 12px; color: #666666;">
            Não possui uma conta? <a th:href="@{/cadastro}" style="color: #0066cc;">Cadastre-se aqui</a>
        </div>
    </div>
</div>
</body>
</html>
