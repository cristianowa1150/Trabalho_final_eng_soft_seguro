<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1600" height="520" rx="28" fill="url(#bg)"/>
  <rect x="28" y="28" width="1544" height="464" rx="22" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Decorative security grid -->
  <g opacity=".12" stroke="#94a3b8" stroke-width="1">
    <path d="M80 110H1520M80 170H1520M80 230H1520M80 290H1520M80 350H1520M80 410H1520"/>
    <path d="M140 70V450M260 70V450M380 70V450M500 70V450M620 70V450M740 70V450M860 70V450M980 70V450M1100 70V450M1220 70V450M1340 70V450M1460 70V450"/>
  </g>

  <!-- Shield -->
  <g transform="translate(105 112)" filter="url(#shadow)">
    <path d="M125 0L235 42V137C235 217 188 278 125 312C62 278 15 217 15 137V42Z"
          fill="#111827" stroke="url(#accent)" stroke-width="8"/>
    <path d="M125 48L190 73V137C190 188 162 228 125 252C88 228 60 188 60 137V73Z"
          fill="none" stroke="#38bdf8" stroke-width="5" opacity=".9"/>
    <path d="M92 148L113 169L162 112" fill="none" stroke="#a78bfa" stroke-width="12"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title -->
  <text x="410" y="155" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif"
        font-size="54" font-weight="700" letter-spacing="2">ENGENHARIA DE</text>
  <text x="410" y="225" fill="white" font-family="Arial, Helvetica, sans-serif"
        font-size="70" font-weight="800" letter-spacing="1">SOFTWARE SEGURO</text>

  <rect x="414" y="255" width="920" height="5" rx="2.5" fill="url(#accent)"/>

  <text x="414" y="305" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif"
        font-size="24">Trabalho Final • PPGCO / UFU</text>
  <text x="414" y="340" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif"
        font-size="20">Professor: Silvio Ereno Quincozes</text>

  <!-- Pipeline -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600">
    <g transform="translate(410 390)">
      <rect width="190" height="54" rx="12" fill="#1e293b" stroke="#38bdf8"/>
      <text x="95" y="33" text-anchor="middle" fill="#e2e8f0">REQUISITOS</text>
    </g>
    <path d="M610 417H650" stroke="#64748b" stroke-width="3"/>
    <path d="M643 410L653 417L643 424" fill="none" stroke="#64748b" stroke-width="3"/>

    <g transform="translate(660 390)">
      <rect width="190" height="54" rx="12" fill="#1e293b" stroke="#38bdf8"/>
      <text x="95" y="33" text-anchor="middle" fill="#e2e8f0">ARQUITETURA</text>
    </g>
    <path d="M860 417H900" stroke="#64748b" stroke-width="3"/>
    <path d="M893 410L903 417L893 424" fill="none" stroke="#64748b" stroke-width="3"/>

    <g transform="translate(910 390)">
      <rect width="190" height="54" rx="12" fill="#1e293b" stroke="#a78bfa"/>
      <text x="95" y="33" text-anchor="middle" fill="#e2e8f0">CÓDIGO SEGURO</text>
    </g>
    <path d="M1110 417H1150" stroke="#64748b" stroke-width="3"/>
    <path d="M1143 410L1153 417L1143 424" fill="none" stroke="#64748b" stroke-width="3"/>

    <g transform="translate(1160 390)">
      <rect width="190" height="54" rx="12" fill="#1e293b" stroke="#a78bfa"/>
      <text x="95" y="33" text-anchor="middle" fill="#e2e8f0">DEVSECOPS</text>
    </g>
  </g>

  <!-- Code brackets -->
  <text x="1440" y="135" fill="#38bdf8" font-family="monospace" font-size="64" font-weight="700">&lt;/&gt;</text>
  <text x="1410" y="185" fill="#a78bfa" font-family="monospace" font-size="22">SECURITY BY DESIGN</text>
</svg>
